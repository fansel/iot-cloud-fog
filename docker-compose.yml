x-fog: &fog
  image: mp3-fog:latest
  cpus: "0.5"
  mem_limit: 256m
  cap_add: [NET_ADMIN]   # needed only for tc netem

services:
  fog-a:
    <<: *fog
    build: { context: ., dockerfile: fog/Dockerfile }   # fog-b reuses this image
    environment:
      { ZONE: A, LISTEN_IP: 10.10.1.10, BACKBONE_IP: 10.10.10.11,
        CLOUD_URL: "http://10.10.10.20:8000",
        LOG_URL: "http://10.10.20.30:9000/ingest", NETEM_DELAY: 20ms }
    networks:
      zone_a_net: { ipv4_address: 10.10.1.10 }
      backbone_net: { ipv4_address: 10.10.10.11 }
      mgmt_net: { ipv4_address: 10.10.20.11 }

  fog-b:
    <<: *fog
    environment:
      { ZONE: B, LISTEN_IP: 10.10.2.10, BACKBONE_IP: 10.10.10.12,
        CLOUD_URL: "http://10.10.10.20:8000",
        LOG_URL: "http://10.10.20.30:9000/ingest", NETEM_DELAY: 20ms }
    networks:
      zone_b_net: { ipv4_address: 10.10.2.10 }
      backbone_net: { ipv4_address: 10.10.10.12 }
      mgmt_net: { ipv4_address: 10.10.20.12 }

  cloud:
    build: { context: ., dockerfile: cloud/Dockerfile }
    cap_add: [NET_ADMIN]
    environment:
      { BACKBONE_IP: 10.10.10.20, NETEM_DELAY: 20ms,
        LOG_URL: "http://10.10.20.30:9000/ingest" }
    networks:
      backbone_net: { ipv4_address: 10.10.10.20 }
      mgmt_net: { ipv4_address: 10.10.20.20 }

  logger:
    build: { context: ., dockerfile: monitoring/Dockerfile }
    volumes: ["./results/logs:/logs"]
    networks:
      mgmt_net: { ipv4_address: 10.10.20.30 }

  cam-a1:
    build: { context: ., dockerfile: camera/Dockerfile }
    environment: { CAMERA_ID: cam-a1, FOG_URL: "http://10.10.1.10:8000" }
    volumes: ["./results:/results"]
    networks:
      zone_a_net: { ipv4_address: 10.10.1.21 }

  cam-a2:
    build: { context: ., dockerfile: camera/Dockerfile }
    environment: { CAMERA_ID: cam-a2, FOG_URL: "http://10.10.1.10:8000" }
    volumes: ["./results:/results"]
    networks:
      zone_a_net: { ipv4_address: 10.10.1.22 }

  cam-b1:
    build: { context: ., dockerfile: camera/Dockerfile }
    environment: { CAMERA_ID: cam-b1, FOG_URL: "http://10.10.2.10:8000" }
    volumes: ["./results:/results"]
    networks:
      zone_b_net: { ipv4_address: 10.10.2.21 }

networks:
  zone_a_net:
    internal: true
    ipam: { config: [{ subnet: 10.10.1.0/24 }] }
  zone_b_net:
    internal: true
    ipam: { config: [{ subnet: 10.10.2.0/24 }] }
  backbone_net:
    ipam: { config: [{ subnet: 10.10.10.0/24 }] }
  mgmt_net:
    ipam: { config: [{ subnet: 10.10.20.0/24 }] }